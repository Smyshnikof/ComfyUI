name: Preset link health

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  issues: write

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests fastapi huggingface_hub

      - name: Check preset URLs
        id: check
        run: |
          set -o pipefail
          python scripts/check_links.py 2>&1 | tee link-check.log
        continue-on-error: true

      - name: Open issue on failure
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('link-check.log')
              ? fs.readFileSync('link-check.log', 'utf8')
              : 'Link check failed (no log).';
            const body = [
              'Weekly preset link check found broken or unreachable URLs.',
              '',
              '```',
              log.slice(0, 60000),
              '```',
              '',
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Preset link check failed',
              body,
              labels: ['link-health'],
            });

      - name: Fail job if links broken
        if: steps.check.outcome == 'failure'
        run: exit 1
