name: Preset link health

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  issues: write

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Check preset URLs
        id: check
        run: |
          set -o pipefail
          python scripts/check_links.py 2>&1 | tee link-check.log

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: link-check-log
          path: link-check.log
          retention-days: 14

      - name: Open issue on failure
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('link-check.log')
              ? fs.readFileSync('link-check.log', 'utf8')
              : 'Link check failed (no log).';
            const body = [
              'Preset link check found broken or unreachable URLs.',
              '',
              '```',
              log.slice(0, 60000),
              '```',
              '',
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            const payload = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Preset link check failed',
              body,
            };
            try {
              await github.rest.issues.create({ ...payload, labels: ['link-health'] });
            } catch (error) {
              core.warning(`Could not create labeled issue: ${error.message}`);
              await github.rest.issues.create(payload);
            }
